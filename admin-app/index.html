<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CabSure Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="login-view" class="login-shell">
      <form id="login-form" class="login-card">
        <img class="brand-logo login-logo" src="./assets/logo.svg" alt="CabSure" />
        <p class="eyebrow">CABSURE OPERATIONS</p>
        <h1>Admin sign in</h1>
        <p class="muted">Review drivers, documents, vehicles, and support requests securely.</p>
        <label>Email<input id="email" type="email" autocomplete="email" required /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit">Sign in securely</button>
      </form>
    </main>

    <main id="app-view" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="./assets/logo.svg" alt="" /><span>CabSure Admin</span></div>
        <nav>
          <button class="nav-item active" data-page="overview">Overview</button>
          <button class="nav-item" data-page="documents">Document reviews</button>
          <button class="nav-item" data-page="drivers">Drivers & vehicles</button>
          <button class="nav-item" data-page="support">Support tickets</button>
          <button class="nav-item" data-page="outstation">Outstation bookings</button>
          <button class="nav-item" data-page="account">Admin account</button>
        </nav>
        <button id="logout" class="logout">Sign out</button>
      </aside>
      <section class="content-shell">
        <header class="topbar"><div><p class="eyebrow">OPERATIONS CONSOLE</p><h1 id="page-title">Overview</h1></div><div class="admin-identity"><strong id="admin-name"></strong><span id="admin-role"></span></div></header>
        <p id="app-error" class="error" role="alert"></p>
        <section id="page-content"></section>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
